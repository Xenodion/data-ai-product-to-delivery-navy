<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 1080" width="1290" height="1080" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Keelpay decision flow</title>
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e3e7ee"/></pattern>
  <linearGradient id="gen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#c026d3"/></linearGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2a44" flood-opacity="0.10"/></filter>
  <marker id="a-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#33415c"/></marker>
  <marker id="a-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d1345b"/></marker>
</defs>
<style>
  .hd { font-size: 11.5px; font-weight: 800; letter-spacing: 0.7px; fill: #fff; }
  .t { font-size: 16px; font-weight: 700; fill: #1f2a44; }
  .d { font-size: 13px; fill: #4a5568; }
  .w { font-size: 12px; font-weight: 600; }
  .kt { font-size: 13.5px; font-weight: 800; }
  .kd { font-size: 12.5px; fill: #4a5568; }
  .lm, .lf { font-size: 13px; font-weight: 600; paint-order: stroke; stroke: #fbfcfd; stroke-width: 4px; }
  .lm { fill: #33415c; } .lf { fill: #b8264b; }
  .m { fill: none; stroke: #33415c; stroke-width: 2.6; }
  .f { fill: none; stroke: #d1345b; stroke-width: 2.2; }
  .fd { fill: none; stroke: #d1345b; stroke-width: 2.2; stroke-dasharray: 7 5; }
</style>
<rect width="1290" height="1080" fill="#fbfcfd"/>
<rect width="1290" height="1080" fill="url(#dots)"/>
<text x="40" y="50" font-size="26" font-weight="700" fill="#1f2a44">Keelpay · How a ticket gets answered</text>
<text x="40" y="78" font-size="15" fill="#4a5568">Each step is coloured by what it is, because that tells you how far you can trust it.</text>
<g transform="translate(40 96)">
  <rect width="394" height="62" rx="11" fill="#f5f9ff" stroke="#bcd2f3" stroke-width="1.4"/>
  <rect x="12" y="13" width="36" height="36" rx="10" fill="#2563c9"/>
  <svg x="20" y="21" width="20" height="20" viewBox="0 0 20 20"><text x="10" y="15" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" font-family="Consolas, monospace">{ }</text></svg>
  <text x="60" y="22" class="kt" fill="#1f4fa3">DETERMINISTIC · Python rules</text>
  <text x="60" y="39" class="kd">Same input, same result.</text>
  <text x="60" y="54" class="kd">Fully testable, free to run.</text>
</g>
<g transform="translate(448 96)">
  <rect width="394" height="62" rx="11" fill="#faf7ff" stroke="#d5c3f7" stroke-width="1.4"/>
  <rect x="12" y="13" width="36" height="36" rx="10" fill="url(#gen)"/>
  <svg x="20" y="21" width="20" height="20" viewBox="0 0 20 20"><path d="M10 1L12.4 7.6L19 10L12.4 12.4L10 19L7.6 12.4L1 10L7.6 7.6z" fill="#fff"/></svg>
  <text x="60" y="22" class="kt" fill="#6429cf">GENERATIVE · LLM</text>
  <text x="60" y="39" class="kd">Probabilistic, it can be wrong.</text>
  <text x="60" y="54" class="kd">So it proposes, and never decides alone.</text>
</g>
<g transform="translate(856 96)">
  <rect width="394" height="62" rx="11" fill="#fff9f1" stroke="#f6cf9f" stroke-width="1.4"/>
  <rect x="12" y="13" width="36" height="36" rx="10" fill="#e8730c"/>
  <svg x="20" y="21" width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="6" r="4" fill="#fff"/><path d="M2 19C2 13 6 11.5 10 11.5S18 13 18 19z" fill="#fff"/></svg>
  <text x="60" y="22" class="kt" fill="#b85a06">HUMAN · Support agent</text>
  <text x="60" y="39" class="kd">Slower and costly, but accountable.</text>
  <text x="60" y="54" class="kd">Always has the last word.</text>
</g>
<rect x="680" y="176" width="570" height="138" rx="15" fill="#f1f6fe" stroke="#bcd2f3" stroke-width="1.2"/>
<text x="696" y="199" class="kt" fill="#2563c9">Tools the Drafter can call · read-only</text>
