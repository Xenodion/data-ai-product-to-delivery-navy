<g transform="translate(40 180)">
  <rect width="250" height="130" rx="13" fill="#ffffff" stroke="#d9dfe8" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M0 30V13A13 13 0 0 1 13 0H237A13 13 0 0 1 250 13V30z" fill="#5a6b86"/>
  <svg x="12" y="7" width="16" height="16" viewBox="0 0 20 20"><circle cx="10" cy="10" r="5" fill="#fff"/></svg>
  <text x="36" y="20" class="hd">START</text>
  <text x="16" y="54" class="t">Ticket arrives</text>
  <text x="16" y="75" class="d">A merchant writes in</text>
  <text x="16" y="93" class="d">French or English.</text>
  <text x="16" y="116" class="w" fill="#4a5875">Demo Injector script</text>
</g>
<g transform="translate(40 400)">
  <rect width="250" height="130" rx="13" fill="#faf7ff" stroke="#d5c3f7" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M0 30V13A13 13 0 0 1 13 0H237A13 13 0 0 1 250 13V30z" fill="url(#gen)"/>
  <svg x="12" y="7" width="16" height="16" viewBox="0 0 20 20"><path d="M10 1L12.4 7.6L19 10L12.4 12.4L10 19L7.6 12.4L1 10L7.6 7.6z" fill="#fff"/></svg>
  <text x="36" y="20" class="hd">GENERATIVE</text>
  <text x="16" y="54" class="t">Qualifier Model</text>
  <text x="16" y="75" class="d">Our fine-tuned LLM fills 7 fields.</text>
  <text x="16" y="93" class="d">It decides nothing.</text>
  <text x="16" y="116" class="w" fill="#6429cf">Our server, on CPU</text>
</g>
<g transform="translate(360 400)">
  <rect width="250" height="130" rx="13" fill="#f5f9ff" stroke="#bcd2f3" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M0 30V13A13 13 0 0 1 13 0H237A13 13 0 0 1 250 13V30z" fill="#2563c9"/>
  <svg x="12" y="7" width="16" height="16" viewBox="0 0 20 20"><text x="10" y="15" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" font-family="Consolas, monospace">{ }</text></svg>
  <text x="36" y="20" class="hd">DETERMINISTIC DECISION</text>
  <text x="16" y="54" class="t">Desk known?</text>
  <text x="16" y="75" class="d">Python rules map the intent</text>
  <text x="16" y="93" class="d">to one of the four desks.</text>
  <text x="16" y="116" class="w" fill="#1f4fa3">Routing Node, Python backend</text>
</g>
<g transform="translate(680 400)">
  <rect width="250" height="130" rx="13" fill="#faf7ff" stroke="#d5c3f7" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M0 30V13A13 13 0 0 1 13 0H237A13 13 0 0 1 250 13V30z" fill="url(#gen)"/>
  <svg x="12" y="7" width="16" height="16" viewBox="0 0 20 20"><path d="M10 1L12.4 7.6L19 10L12.4 12.4L10 19L7.6 12.4L1 10L7.6 7.6z" fill="#fff"/></svg>
  <text x="36" y="20" class="hd">GENERATIVE</text>
  <text x="16" y="54" class="t">Drafter Model</text>
  <text x="16" y="75" class="d">Writes a reply from the ticket</text>
  <text x="16" y="93" class="d">and the facts it gathered.</text>
  <text x="16" y="116" class="w" fill="#6429cf">External LLM API</text>
</g>
<g transform="translate(1000 400)">
  <rect width="250" height="130" rx="13" fill="#fff9f1" stroke="#f6cf9f" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M0 30V13A13 13 0 0 1 13 0H237A13 13 0 0 1 250 13V30z" fill="#e8730c"/>
  <svg x="12" y="7" width="16" height="16" viewBox="0 0 20 20"><circle cx="10" cy="6" r="4" fill="#fff"/><path d="M2 19C2 13 6 11.5 10 11.5S18 13 18 19z" fill="#fff"/></svg>
  <text x="36" y="20" class="hd">HUMAN DECISION</text>
  <text x="16" y="54" class="t">Right desk?</text>
  <text x="16" y="75" class="d">The agent reads the ticket</text>
  <text x="16" y="93" class="d">and the draft.</text>
  <text x="16" y="116" class="w" fill="#b85a06">Web app, Validator tab</text>
</g>
<g transform="translate(360 650)">
  <rect width="250" height="130" rx="13" fill="#fff9f1" stroke="#f6cf9f" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M0 30V13A13 13 0 0 1 13 0H237A13 13 0 0 1 250 13V30z" fill="#e8730c"/>
  <svg x="12" y="7" width="16" height="16" viewBox="0 0 20 20"><circle cx="10" cy="6" r="4" fill="#fff"/><path d="M2 19C2 13 6 11.5 10 11.5S18 13 18 19z" fill="#fff"/></svg>
  <text x="36" y="20" class="hd">HUMAN</text>
  <text x="16" y="54" class="t">Re-router</text>
  <text x="16" y="75" class="d">The agent reads the ticket</text>
  <text x="16" y="93" class="d">and picks the right desk.</text>
  <text x="16" y="116" class="w" fill="#b85a06">Web app, Re-router tab</text>
</g>
<g transform="translate(680 650)">
  <rect width="250" height="130" rx="13" fill="#f5f9ff" stroke="#bcd2f3" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M0 30V13A13 13 0 0 1 13 0H237A13 13 0 0 1 250 13V30z" fill="#2563c9"/>
  <svg x="12" y="7" width="16" height="16" viewBox="0 0 20 20"><text x="10" y="15" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" font-family="Consolas, monospace">{ }</text></svg>
  <text x="36" y="20" class="hd">DETERMINISTIC DECISION</text>
  <text x="16" y="54" class="t">First desk change?</text>
  <text x="16" y="75" class="d">Python counter that stops</text>
  <text x="16" y="93" class="d">the ticket looping forever.</text>
  <text x="16" y="116" class="w" fill="#1f4fa3">Python backend</text>
</g>
<g transform="translate(1000 650)">
  <rect width="250" height="130" rx="13" fill="#fff9f1" stroke="#f6cf9f" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M0 30V13A13 13 0 0 1 13 0H237A13 13 0 0 1 250 13V30z" fill="#e8730c"/>
  <svg x="12" y="7" width="16" height="16" viewBox="0 0 20 20"><circle cx="10" cy="6" r="4" fill="#fff"/><path d="M2 19C2 13 6 11.5 10 11.5S18 13 18 19z" fill="#fff"/></svg>
  <text x="36" y="20" class="hd">HUMAN DECISION</text>
  <text x="16" y="54" class="t">Draft good?</text>
  <text x="16" y="75" class="d">The agent checks the facts</text>
  <text x="16" y="93" class="d">and the tone.</text>
  <text x="16" y="116" class="w" fill="#b85a06">Web app, Validator tab</text>
</g>
<g transform="translate(680 880)">
  <rect width="250" height="130" rx="13" fill="#fff9f1" stroke="#f6cf9f" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M0 30V13A13 13 0 0 1 13 0H237A13 13 0 0 1 250 13V30z" fill="#e8730c"/>
  <svg x="12" y="7" width="16" height="16" viewBox="0 0 20 20"><circle cx="10" cy="6" r="4" fill="#fff"/><path d="M2 19C2 13 6 11.5 10 11.5S18 13 18 19z" fill="#fff"/></svg>
  <text x="36" y="20" class="hd">HUMAN</text>
  <text x="16" y="54" class="t">Agent edits it</text>
  <text x="16" y="75" class="d">Fixes the draft, or writes</text>
  <text x="16" y="93" class="d">the reply by hand.</text>
  <text x="16" y="116" class="w" fill="#b85a06">Web app, Validator tab</text>
</g>
<g transform="translate(1000 880)">
  <rect width="250" height="130" rx="13" fill="#ffffff" stroke="#d9dfe8" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M0 30V13A13 13 0 0 1 13 0H237A13 13 0 0 1 250 13V30z" fill="#5a6b86"/>
  <svg x="12" y="7" width="16" height="16" viewBox="0 0 20 20"><circle cx="10" cy="10" r="5" fill="#fff"/></svg>
  <text x="36" y="20" class="hd">END</text>
  <text x="16" y="54" class="t">Reply sent</text>
  <text x="16" y="75" class="d">Simulated, no real message.</text>
  <text x="16" y="93" class="d">Only after a human click.</text>
  <text x="16" y="116" class="w" fill="#4a5875">Python backend</text>
</g>
<g transform="translate(696 212)">
  <rect width="255" height="88" rx="11" fill="#f5f9ff" stroke="#bcd2f3" stroke-width="1.5"/>
  <path d="M0 24V11A11 11 0 0 1 11 0H244A11 11 0 0 1 255 11V24z" fill="#2563c9"/>
  <text x="14" y="17" class="hd" style="font-size:10.5px">DETERMINISTIC · TOOL</text>
  <text x="14" y="45" class="t" style="font-size:14.5px">Lookup</text>
  <text x="14" y="64" class="d">Finds the payment in a</text>
  <text x="14" y="80" class="d">fake transactions table</text>
</g>
<g transform="translate(979 212)">
  <rect width="255" height="88" rx="11" fill="#f5f9ff" stroke="#bcd2f3" stroke-width="1.5"/>
  <path d="M0 24V11A11 11 0 0 1 11 0H244A11 11 0 0 1 255 11V24z" fill="#2563c9"/>
  <text x="14" y="17" class="hd" style="font-size:10.5px">DETERMINISTIC · TOOL</text>
  <text x="14" y="45" class="t" style="font-size:14.5px">Retrieval</text>
  <text x="14" y="64" class="d">Finds the right passage</text>
  <text x="14" y="80" class="d">in a fake help centre</text>
</g>
