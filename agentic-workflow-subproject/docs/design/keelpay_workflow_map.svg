<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 950" width="1370" height="950" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Keelpay decision flow</title>
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e3e7ee"/></pattern>
  <linearGradient id="gen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#c026d3"/></linearGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2a44" flood-opacity="0.10"/></filter>
  <marker id="a-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#33415c"/></marker>
  <marker id="a-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d1345b"/></marker>
</defs>
<style>
  .hd { font-size: 11.5px; font-weight: 800; letter-spacing: 0.7px; fill: #fff; }
  .t { font-size: 16px; font-weight: 700; fill: #1f2a44; }
  .d { font-size: 13px; fill: #4a5568; }
  .w { font-size: 12px; font-weight: 600; }
  .kt { font-size: 15px; font-weight: 800; letter-spacing: 0.3px; }
  .kd { font-size: 13px; fill: #4a5568; }
  .lm, .lf { font-size: 13px; font-weight: 600; paint-order: stroke; stroke: #fff; stroke-width: 3.5px; stroke-opacity: 0.85; }
  .lm { fill: #33415c; } .lf { fill: #b8264b; }
  .m { fill: none; stroke: #33415c; stroke-width: 2.6; }
  .f { fill: none; stroke: #d1345b; stroke-width: 2.2; }
</style>
<rect width="1370" height="950" fill="#fbfcfd"/>
<rect width="1370" height="950" fill="url(#dots)"/>
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2a44">Keelpay · How a ticket gets answered</text>
<text x="24" y="74" font-size="15" fill="#4a5568">Three layers, because what a step is tells you how far you can trust it.</text>
<rect x="150" y="100" width="1060" height="240" rx="18" fill="#eef4fe" stroke="#bcd2f3" stroke-width="1.4"/>
<rect x="150" y="360" width="1060" height="230" rx="18" fill="#f7f2fe" stroke="#d5c3f7" stroke-width="1.4"/>
<rect x="150" y="610" width="1060" height="256" rx="18" fill="#fff4e6" stroke="#f6cf9f" stroke-width="1.4"/>
<g transform="translate(170 122)">
  <rect width="30" height="30" rx="9" fill="#2563c9"/>
  <svg x="6" y="6" width="18" height="18" viewBox="0 0 20 20"><text x="10" y="15" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" font-family="Consolas, monospace">{ }</text></svg>
  <text x="40" y="21" class="kt" fill="#1f4fa3">DETERMINISTIC</text>
  <text x="0" y="52" class="kd">Same input, same result.</text>
  <text x="0" y="70" class="kd">Fully testable, free to run.</text>
</g>
<g transform="translate(980 374)">
  <rect width="30" height="30" rx="9" fill="url(#gen)"/>
  <svg x="6" y="6" width="18" height="18" viewBox="0 0 20 20"><path d="M10 1L12.4 7.6L19 10L12.4 12.4L10 19L7.6 12.4L1 10L7.6 7.6z" fill="#fff"/></svg>
  <text x="40" y="21" class="kt" fill="#6429cf">AGENTIC</text>
  <text x="0" y="52" class="kd">Probabilistic, it can be wrong.</text>
  <text x="0" y="70" class="kd">Proposes, never decides alone.</text>
</g>
<g transform="translate(170 632)">
  <rect width="30" height="30" rx="9" fill="#e8730c"/>
  <svg x="6" y="6" width="18" height="18" viewBox="0 0 20 20"><circle cx="10" cy="6" r="4" fill="#fff"/><path d="M2 19C2 13 6 11.5 10 11.5S18 13 18 19z" fill="#fff"/></svg>
  <text x="40" y="21" class="kt" fill="#b85a06">HUMAN · THE APP</text>
  <text x="0" y="52" class="kd">Slower and costly, but accountable.</text>
  <text x="0" y="70" class="kd">Always has the last word.</text>
</g>
<rect x="710" y="118" width="482" height="210" rx="15" fill="#e3edfc" stroke="#bcd2f3" stroke-width="1.2"/>
<text x="726" y="145" class="kd" style="font-weight:700;fill:#2563c9">Tools the Drafter can call · read-only</text>
<path class="m" d="M134 482H168" marker-end="url(#a-m)"/>
<path class="m" d="M380 482H395Q410 482 410 467V263Q410 248 425 248H428" marker-end="url(#a-m)"/>
<path class="m" d="M580 318V467Q580 482 595 482H708" marker-end="url(#a-m)"/>
<path class="m" d="M920 482H1040Q1055 482 1055 497V658" marker-end="url(#a-m)"/>
<path class="m" d="M920 700H978" marker-end="url(#a-m)"/>
<path class="m" d="M1190 730H1238" marker-end="url(#a-m)"/>
<path class="m" d="M795 412V330" marker-end="url(#a-m)"/>
<path class="m" d="M835 328V410" marker-end="url(#a-m)"/>
<path class="f" d="M480 318V658" marker-end="url(#a-f)"/>
<path class="f" d="M590 660V612Q590 597 605 597H745Q760 597 760 582V554" marker-end="url(#a-f)"/>
<path class="f" d="M640 730H708" marker-end="url(#a-f)"/>
<path class="f" d="M980 760H922" marker-end="url(#a-f)"/>
<path class="f" d="M1085 800V827Q1085 842 1070 842H550Q535 842 535 827V802" marker-end="url(#a-f)"/>
<g transform="translate(170 412)">
  <rect width="210" height="140" rx="13" fill="#fff" stroke="#d5c3f7" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M0 29V13A13 13 0 0 1 13 0H197A13 13 0 0 1 210 13V29z" fill="url(#gen)"/>
  <svg x="12" y="7" width="15" height="15" viewBox="0 0 20 20"><path d="M10 1L12.4 7.6L19 10L12.4 12.4L10 19L7.6 12.4L1 10L7.6 7.6z" fill="#fff"/></svg>
  <text x="34" y="19" class="hd">LLM</text>
  <text x="14" y="52" class="t">Qualifier Model</text>
  <text x="14" y="74" class="d">Our fine-tuned LLM reads</text><text x="14" y="91" class="d">the ticket, fills 7 fields.</text><text x="14" y="108" class="d">It decides nothing.</text>
  <text x="14" y="130" class="w" fill="#6429cf">Our server, on CPU</text>
</g>
<g transform="translate(430 178)">
  <rect width="210" height="140" rx="13" fill="#fff" stroke="#bcd2f3" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M0 29V13A13 13 0 0 1 13 0H197A13 13 0 0 1 210 13V29z" fill="#2563c9"/>
  <svg x="12" y="7" width="15" height="15" viewBox="0 0 20 20"><text x="10" y="15" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" font-family="Consolas, monospace">{ }</text></svg>
  <text x="34" y="19" class="hd">RULES DECISION</text>
  <text x="14" y="52" class="t">Routing Node</text>
  <text x="14" y="74" class="d">Desk known? Rules map the</text><text x="14" y="91" class="d">intent to one of 4 desks.</text><text x="14" y="108" class="d">Urgency sets the priority.</text>
  <text x="14" y="130" class="w" fill="#1f4fa3">Python backend</text>
</g>
<g transform="translate(710 412)">
  <rect width="210" height="140" rx="13" fill="#fff" stroke="#d5c3f7" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M0 29V13A13 13 0 0 1 13 0H197A13 13 0 0 1 210 13V29z" fill="url(#gen)"/>
  <svg x="12" y="7" width="15" height="15" viewBox="0 0 20 20"><path d="M10 1L12.4 7.6L19 10L12.4 12.4L10 19L7.6 12.4L1 10L7.6 7.6z" fill="#fff"/></svg>
  <text x="34" y="19" class="hd">LLM</text>
  <text x="14" y="52" class="t">Drafter Model</text>
  <text x="14" y="74" class="d">Writes a reply from the</text><text x="14" y="91" class="d">ticket and the facts it</text><text x="14" y="108" class="d">gets from the tools.</text>
  <text x="14" y="130" class="w" fill="#6429cf">External LLM API</text>
</g>
<g transform="translate(722 160)">
  <rect width="226" height="156" rx="13" fill="#fff" stroke="#bcd2f3" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M0 29V13A13 13 0 0 1 13 0H213A13 13 0 0 1 226 13V29z" fill="#2563c9"/>
  <svg x="12" y="7" width="15" height="15" viewBox="0 0 20 20"><text x="10" y="15" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" font-family="Consolas, monospace">{ }</text></svg>
  <text x="34" y="19" class="hd">TOOL</text>
  <text x="14" y="52" class="t">SQL lookup</text>
  <text x="14" y="74" class="d">Read-only query on a fake</text><text x="14" y="91" class="d">transactions table, one</text><text x="14" y="108" class="d">merchant at a time.</text>
  <text x="14" y="130" class="w" fill="#1f4fa3">Python backend</text>
</g>
<g transform="translate(954 160)">
  <rect width="226" height="156" rx="13" fill="#fff" stroke="#bcd2f3" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M0 29V13A13 13 0 0 1 13 0H213A13 13 0 0 1 226 13V29z" fill="#2563c9"/>
  <svg x="12" y="7" width="15" height="15" viewBox="0 0 20 20"><text x="10" y="15" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" font-family="Consolas, monospace">{ }</text></svg>
  <text x="34" y="19" class="hd">TOOL</text>
  <text x="14" y="52" class="t">RAG search</text>
  <text x="14" y="74" class="d">Finds the right passage in</text><text x="14" y="91" class="d">a fake help centre and</text><text x="14" y="108" class="d">keeps its source.</text>
  <text x="14" y="130" class="w" fill="#1f4fa3">Python backend</text>
</g>
<g transform="translate(430 660)">
  <rect width="210" height="140" rx="13" fill="#fff" stroke="#f6cf9f" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M0 29V13A13 13 0 0 1 13 0H197A13 13 0 0 1 210 13V29z" fill="#e8730c"/>
  <svg x="12" y="7" width="15" height="15" viewBox="0 0 20 20"><circle cx="10" cy="6" r="4" fill="#fff"/><path d="M2 19C2 13 6 11.5 10 11.5S18 13 18 19z" fill="#fff"/></svg>
  <text x="34" y="19" class="hd">HUMAN DECISION</text>
  <text x="14" y="52" class="t">Re-router</text>
  <text x="14" y="74" class="d">Reads the ticket and</text><text x="14" y="91" class="d">picks the right desk.</text>
  <text x="14" y="130" class="w" fill="#b85a06">App · Re-router tab</text>
</g>
<g transform="translate(710 660)">
  <rect width="210" height="140" rx="13" fill="#fff" stroke="#f6cf9f" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M0 29V13A13 13 0 0 1 13 0H197A13 13 0 0 1 210 13V29z" fill="#e8730c"/>
  <svg x="12" y="7" width="15" height="15" viewBox="0 0 20 20"><circle cx="10" cy="6" r="4" fill="#fff"/><path d="M2 19C2 13 6 11.5 10 11.5S18 13 18 19z" fill="#fff"/></svg>
  <text x="34" y="19" class="hd">HUMAN</text>
  <text x="14" y="52" class="t">Agent edits</text>
  <text x="14" y="74" class="d">Fixes the draft, or writes</text><text x="14" y="91" class="d">the reply by hand.</text>
  <text x="14" y="130" class="w" fill="#b85a06">App · Validator tab</text>
</g>
<g transform="translate(980 660)">
  <rect width="210" height="140" rx="13" fill="#fff" stroke="#f6cf9f" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M0 29V13A13 13 0 0 1 13 0H197A13 13 0 0 1 210 13V29z" fill="#e8730c"/>
  <svg x="12" y="7" width="15" height="15" viewBox="0 0 20 20"><circle cx="10" cy="6" r="4" fill="#fff"/><path d="M2 19C2 13 6 11.5 10 11.5S18 13 18 19z" fill="#fff"/></svg>
  <text x="34" y="19" class="hd">HUMAN DECISION</text>
  <text x="14" y="52" class="t">Validator</text>
  <text x="14" y="74" class="d">Right desk? Draft good?</text><text x="14" y="91" class="d">Approves every reply,</text><text x="14" y="108" class="d">or sends it back.</text>
  <text x="14" y="130" class="w" fill="#b85a06">App · Validator tab</text>
</g>
<g transform="translate(24 449)">
  <rect width="110" height="66" rx="13" fill="#fff" stroke="#5a6b86" stroke-width="1.8" filter="url(#sh)"/>
  <text x="55" y="29" class="t" text-anchor="middle" style="font-size:14px">Ticket</text>
  <text x="55" y="48" class="d" text-anchor="middle">received</text>
</g>
<g transform="translate(1240 697)">
  <rect width="110" height="66" rx="13" fill="#fff" stroke="#5a6b86" stroke-width="1.8" filter="url(#sh)"/>
  <text x="55" y="29" class="t" text-anchor="middle" style="font-size:14px">Reply sent</text>
  <text x="55" y="48" class="d" text-anchor="middle">simulated</text>
</g>
