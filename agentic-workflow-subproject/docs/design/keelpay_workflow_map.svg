<circle cx="710" cy="482" r="4.5" fill="#fff" stroke="#33415c" stroke-width="2"/>
<circle cx="920" cy="482" r="4.5" fill="#fff" stroke="#33415c" stroke-width="2"/>
<circle cx="1055" cy="660" r="4.5" fill="#fff" stroke="#33415c" stroke-width="2"/>
