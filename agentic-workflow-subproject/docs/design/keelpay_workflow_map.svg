<circle cx="980" cy="700" r="4.5" fill="#fff" stroke="#33415c" stroke-width="2"/>
<circle cx="1190" cy="730" r="4.5" fill="#fff" stroke="#33415c" stroke-width="2"/>
<circle cx="1240" cy="730" r="4.5" fill="#fff" stroke="#33415c" stroke-width="2"/>
<circle cx="795" cy="412" r="4.5" fill="#fff" stroke="#33415c" stroke-width="2"/>
<circle cx="835" cy="412" r="4.5" fill="#fff" stroke="#33415c" stroke-width="2"/>
<circle cx="480" cy="318" r="4.5" fill="#fff" stroke="#d1345b" stroke-width="2"/>
<circle cx="480" cy="660" r="4.5" fill="#fff" stroke="#d1345b" stroke-width="2"/>
<circle cx="590" cy="660" r="4.5" fill="#fff" stroke="#d1345b" stroke-width="2"/>
<circle cx="640" cy="730" r="4.5" fill="#fff" stroke="#d1345b" stroke-width="2"/>
<circle cx="710" cy="730" r="4.5" fill="#fff" stroke="#d1345b" stroke-width="2"/>
<circle cx="980" cy="760" r="4.5" fill="#fff" stroke="#d1345b" stroke-width="2"/>
<circle cx="920" cy="760" r="4.5" fill="#fff" stroke="#d1345b" stroke-width="2"/>
<circle cx="1085" cy="800" r="4.5" fill="#fff" stroke="#d1345b" stroke-width="2"/>
<circle cx="535" cy="800" r="4.5" fill="#fff" stroke="#d1345b" stroke-width="2"/>
<text x="600" y="472" class="lm" text-anchor="start">every ticket</text>
<text x="935" y="472" class="lm" text-anchor="start">draft ready</text>
<text x="950" y="692" class="lm" text-anchor="middle">ready</text>
<text x="785" y="378" class="lm" text-anchor="end">asks</text>
<text x="845" y="378" class="lm" text-anchor="start">returns facts</text>
<text x="490" y="530" class="lf" text-anchor="start">desk unknown:</text>
<text x="490" y="548" class="lf" text-anchor="start">a person picks it too</text>
<text x="604" y="626" class="lf" text-anchor="start">1st desk change: one new draft</text>
<text x="675" y="702" class="lf" text-anchor="middle">2nd</text>
<text x="675" y="720" class="lf" text-anchor="middle">change</text>
<text x="950" y="778" class="lf" text-anchor="middle">fix it</text>
<text x="810" y="834" class="lf" text-anchor="middle">wrong desk: back to the Re-router</text>
<path class="m" d="M150 900H186"/><text x="194" y="905" class="kd">normal path</text>
<path class="f" d="M300 900H336"/><text x="344" y="905" class="kd">correction loop</text>
<text x="1210" y="905" class="kd" text-anchor="end">Urgency never changes the path: it is shown to the agent.</text>
</svg>