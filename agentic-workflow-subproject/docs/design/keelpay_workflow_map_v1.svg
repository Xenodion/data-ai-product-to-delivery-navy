<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" width="1000" height="1100" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif">
  <title>Keelpay support workflow</title>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f55b5"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e65100"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#00838f"/></marker>
    <marker id="s-teal" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0L0 5L10 10z" fill="#00838f"/></marker>
    <symbol id="nodes" viewBox="0 0 20 20"><path d="M4 5L16 10M4 15L16 10M4 5V15" fill="none" stroke="#33415c" stroke-width="1.4"/><circle cx="4" cy="5" r="3" fill="#33415c"/><circle cx="4" cy="15" r="3" fill="#33415c"/><circle cx="16" cy="10" r="3" fill="#33415c"/></symbol>
    <symbol id="branch" viewBox="0 0 20 20"><path d="M3 10H9M9 10L16 4M9 10L16 16" fill="none" stroke="#33415c" stroke-width="2"/><circle cx="3" cy="10" r="2.6" fill="#33415c"/><circle cx="16.5" cy="4" r="2.6" fill="#33415c"/><circle cx="16.5" cy="16" r="2.6" fill="#33415c"/></symbol>
    <symbol id="person" viewBox="0 0 20 20"><circle cx="10" cy="6" r="4" fill="#c75b00"/><path d="M2 19C2 13 6 11.5 10 11.5S18 13 18 19z" fill="#c75b00"/></symbol>
    <symbol id="chat" viewBox="0 0 20 20"><path d="M2 3H18V14H9L4 18V14H2z" fill="#00838f"/><path d="M6 7H14M6 10.5H12" stroke="#fff" stroke-width="1.5"/></symbol>
    <symbol id="db" viewBox="0 0 20 20"><path d="M2 4V16C2 20 18 20 18 16V4" fill="#9fb3d9" stroke="#33415c" stroke-width="1.3"/><ellipse cx="10" cy="4" rx="8" ry="3" fill="#dfe7f5" stroke="#33415c" stroke-width="1.3"/><path d="M2 10C2 13.5 18 13.5 18 10" fill="none" stroke="#33415c" stroke-width="1.3"/></symbol>
    <symbol id="send" viewBox="0 0 20 20"><path d="M1 10L19 2L13 18L9.5 11.5z" fill="#2e7d32"/></symbol>
  </defs>
  <style>
    .t  { font-size: 15px; font-weight: 700; fill: #1f2a44; text-anchor: middle; }
    .s  { font-size: 13px; fill: #4a5568; text-anchor: middle; }
    .b  { font-size: 13px; font-weight: 800; letter-spacing: 0.6px; text-anchor: middle; fill: #fff; }
    .n  { font-size: 13px; font-style: italic; }
    .l  { font-size: 13px; fill: #33415c; }
    .lo { font-size: 13px; fill: #c75b00; }
    .box  { fill: #fff; stroke: #33415c; stroke-width: 1.4; }
    .spine { fill: none; stroke: #2f55b5; stroke-width: 3; }
    .fix   { fill: none; stroke: #e65100; stroke-width: 2; }
    .tool  { fill: none; stroke: #00838f; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .chip { fill: #fff; stroke: #6d4fc2; stroke-width: 1.2; }
    .rule { fill: #fdf0c4; stroke: #b8901a; stroke-width: 1.2; }
    .m { font-family: Consolas, 'DejaVu Sans Mono', monospace; font-size: 13px; fill: #33286b; text-anchor: middle; }
    .mr { font-family: Consolas, 'DejaVu Sans Mono', monospace; font-size: 13px; fill: #4a3800; text-anchor: middle; }
  </style>

  <rect width="1000" height="1100" fill="#fff"/>
  <text x="24" y="38" font-size="22" font-weight="700" fill="#1f2a44">Keelpay · Support workflow</text>

  <!-- INTAKE -->
  <rect x="24" y="60" width="952" height="118" rx="14" fill="#e4ecfa" stroke="#2f55b5" stroke-width="2"/>
  <rect x="44" y="72" width="82" height="24" rx="6" fill="#2f55b5"/><text x="85" y="89" class="b">INTAKE</text>
  <text x="140" y="89" class="n" fill="#2f55b5">synthetic demo data</text>
  <rect x="48" y="108" width="190" height="56" rx="10" class="box"/>
  <text x="143" y="131" class="t">Merchant tickets</text><text x="143" y="151" class="s">Demo Injector, FR / EN</text>
  <rect x="290" y="108" width="190" height="56" rx="10" class="box"/>
  <text x="385" y="131" class="t">Ingress API</text><text x="385" y="151" class="s">idempotent</text>
  <path class="spine" d="M238 136H288" marker-end="url(#a-blue)"/>
  <text x="520" y="131" class="n" fill="#2f55b5">The ticket is stored before any model runs,</text>
  <text x="520" y="149" class="n" fill="#2f55b5">so a failed step never loses it.</text>

  <!-- AUTOMATED -->
  <rect x="24" y="196" width="952" height="440" rx="14" fill="#f8fafc" stroke="#8a97ad" stroke-width="1.6"/>
  <rect x="44" y="208" width="112" height="24" rx="6" fill="#4a5875"/><text x="100" y="225" class="b">AUTOMATED</text>
  <text x="170" y="225" class="n" fill="#4a5875">no send, no financial write</text>

  <rect x="48" y="248" width="432" height="150" rx="10" fill="#e6defa" stroke="#6d4fc2" stroke-width="1.8"/>
  <use href="#nodes" x="182" y="260" width="20" height="20"/>
  <text x="272" y="276" class="t">Qualifier Model</text>
  <text x="264" y="296" class="s">fine-tuned LLM, compact Qwen LoRA on CPU</text>
  <rect x="64" y="306" width="62" height="24" rx="5" class="chip"/><text x="95" y="323" class="m">intent</text>
  <rect x="134" y="306" width="90" height="24" rx="5" class="chip"/><text x="179" y="323" class="m">sub_intent</text>
  <rect x="232" y="306" width="70" height="24" rx="5" class="chip"/><text x="267" y="323" class="m">urgency</text>
  <rect x="310" y="306" width="84" height="24" rx="5" class="chip"/><text x="352" y="323" class="m">sentiment</text>
  <rect x="64" y="336" width="118" height="24" rx="5" class="chip"/><text x="123" y="353" class="m">transaction_id</text>
  <rect x="190" y="336" width="62" height="24" rx="5" class="chip"/><text x="221" y="353" class="m">amount</text>
  <rect x="260" y="336" width="76" height="24" rx="5" class="chip"/><text x="298" y="353" class="m">currency</text>
  <text x="264" y="384" class="s">seven strings, never a queue or an action</text>

  <rect x="540" y="248" width="412" height="150" rx="10" class="box"/>
  <use href="#branch" x="674" y="260" width="20" height="20"/>
  <text x="753" y="276" class="t">Routing Node</text>
  <text x="746" y="296" class="s">deterministic Python, versioned rules</text>
  <rect x="566" y="306" width="166" height="24" rx="5" class="rule"/><text x="649" y="323" class="mr">intent → desk</text>
  <rect x="744" y="306" width="182" height="24" rx="5" class="rule"/><text x="835" y="323" class="mr">urgency → priority</text>
  <text x="746" y="354" class="s">payments · disputes · technical/API · compliance</text>
  <text x="746" y="376" class="s">every decision carries a reason</text>

  <path class="spine" d="M385 164V246" marker-end="url(#a-blue)"/>
  <path class="spine" d="M480 323H538" marker-end="url(#a-blue)"/>
  <text x="509" y="314" class="l" text-anchor="middle">JSON</text>

  <!-- DRAFTER -->
  <rect x="48" y="442" width="692" height="176" rx="12" fill="#e0f4f6" stroke="#00838f" stroke-width="1.8"/>
  <rect x="62" y="454" width="88" height="24" rx="6" fill="#00838f"/><text x="106" y="471" class="b">DRAFTER</text>
  <text x="164" y="471" class="n" fill="#00838f">a draft is only a proposal</text>

  <rect x="64" y="488" width="340" height="118" rx="10" fill="#f2fbfc" stroke="#00838f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="78" y="507" font-size="13" font-weight="600" fill="#00838f">V2 tools · allowlisted, read-only</text>
  <rect x="76" y="516" width="152" height="78" rx="9" fill="#fff" stroke="#00838f" stroke-width="1.5"/>
  <text x="152" y="538" class="t">Lookup Node</text><text x="152" y="558" class="s">synthetic ledger,</text><text x="152" y="576" class="s">merchant-scoped</text>
  <rect x="240" y="516" width="152" height="78" rx="9" fill="#fff" stroke="#00838f" stroke-width="1.5"/>
  <text x="316" y="538" class="t">Retrieval Node</text><text x="316" y="558" class="s">approved KB,</text><text x="316" y="576" class="s">source IDs</text>

  <rect x="470" y="490" width="254" height="114" rx="10" fill="#c5edf0" stroke="#00838f" stroke-width="1.8"/>
  <use href="#chat" x="524" y="500" width="20" height="20"/>
  <text x="607" y="516" class="t">Drafter Model</text>
  <text x="597" y="538" class="s">external LLM API</text>
  <text x="597" y="558" class="s">V1: ticket and available context</text>
  <text x="597" y="578" class="s">failure: retry or manual writing</text>
  <path class="tool" d="M404 547H468" marker-start="url(#s-teal)" marker-end="url(#a-teal)"/>

  <path class="spine" d="M600 398V488" marker-end="url(#a-blue)"/>
  <text x="612" y="425" class="l" font-weight="600" style="fill:#2f55b5">every ticket: draft attempt</text>

  <!-- Unknown desk, in parallel -->
  <text x="840" y="470" class="lo" font-weight="600">desk unknown</text>
  <text x="840" y="490" class="lo">UNDEFINED, OTHER,</text>
  <text x="840" y="508" class="lo">invalid output:</text>
  <text x="840" y="526" class="lo">task in parallel,</text>
  <text x="840" y="544" class="lo">draft continues</text>

  <text x="44" y="657" class="n" fill="#5a6577">No reply leaves without human approval.</text>

  <!-- SUPPORT AGENT -->
  <rect x="24" y="668" width="952" height="240" rx="14" fill="#fff1dc" stroke="#ef8a17" stroke-width="2"/>
  <rect x="44" y="680" width="150" height="24" rx="6" fill="#ef6c00"/><text x="119" y="697" class="b">SUPPORT AGENT</text>
  <text x="208" y="697" class="n" fill="#c75b00">two human nodes, same tickets</text>

  <rect x="48" y="716" width="472" height="86" rx="10" fill="#fff" stroke="#ef8a17" stroke-width="1.8"/>
  <use href="#person" x="232" y="726" width="18" height="18"/>
  <text x="297" y="741" class="t">Validator</text>
  <text x="284" y="763" class="s">edits the draft, checks facts and sources</text>
  <text x="284" y="783" class="s">approves every send</text>

  <rect x="620" y="716" width="332" height="86" rx="10" fill="#fff" stroke="#ef8a17" stroke-width="1.8"/>
  <use href="#person" x="736" y="726" width="18" height="18"/>
  <text x="798" y="741" class="t">Re-router</text>
  <text x="786" y="763" class="s">confirms or corrects the desk</text>
  <text x="786" y="783" class="s">never sends</text>

  <rect x="48" y="832" width="472" height="60" rx="10" fill="#fff" stroke="#2e7d32" stroke-width="1.8"/>
  <use href="#send" x="192" y="842" width="18" height="18"/>
  <text x="292" y="857" class="t">Simulated send</text>
  <text x="284" y="878" class="s">one idempotent event, no real message</text>

  <rect x="620" y="832" width="332" height="60" rx="10" class="box"/>
  <text x="786" y="857" class="t">Manual triage</text>
  <text x="786" y="878" class="s">no automatic loop</text>

  <path class="spine" d="M495 604V714" marker-end="url(#a-blue)"/>
  <path class="fix" d="M830 398V714" marker-end="url(#a-orange)"/>
  <text x="485" y="657" class="l" font-weight="600" text-anchor="end" style="fill:#2f55b5">versioned draft</text>
  <path class="spine" d="M284 802V830" marker-end="url(#a-blue)"/>
  <text x="294" y="821" class="l">approved</text>

  <path class="fix" d="M520 759H618" marker-end="url(#a-orange)"/>
  <text x="570" y="750" class="lo" font-weight="600" text-anchor="middle">wrong desk</text>
  <path class="fix" d="M690 716V606" marker-end="url(#a-orange)"/>
  <text x="700" y="690" class="lo" font-weight="600">desk corrected:</text>
  <text x="700" y="707" class="lo">one fresh draft</text>
  <path class="fix" d="M786 802V830" marker-end="url(#a-orange)"/>
  <text x="796" y="821" class="lo">second desk change</text>

  <!-- BACKEND STATE -->
  <rect x="24" y="926" width="952" height="112" rx="14" fill="#eef1f6" stroke="#4a5875" stroke-width="1.6"/>
  <rect x="44" y="938" width="150" height="24" rx="6" fill="#4a5875"/><text x="119" y="955" class="b">BACKEND STATE</text>
  <text x="208" y="955" class="n" fill="#4a5875">every step writes here, every screen reads from here</text>
  <rect x="48" y="970" width="400" height="54" rx="10" class="box"/>
  <use href="#db" x="66" y="986" width="22" height="22"/>
  <text x="258" y="992" class="t">Ticket store</text>
  <text x="258" y="1012" class="s">queues, draft versions, append-only events</text>
  <rect x="464" y="970" width="262" height="54" rx="10" class="box"/>
  <text x="595" y="992" class="t">Console</text>
  <text x="595" y="1012" class="s">Overview · Re-router · Validator</text>
  <rect x="742" y="970" width="210" height="54" rx="10" class="box"/>
  <text x="847" y="992" class="t">Langfuse</text>
  <text x="847" y="1012" class="s">traces only, not the queues</text>

  <!-- LEGEND -->
  <path class="spine" d="M28 1070H62"/><text x="70" y="1075" class="l">main path</text>
  <path class="fix" d="M170 1070H204"/><text x="212" y="1075" class="l">desk correction</text>
  <path class="tool" d="M340 1070H374"/><text x="382" y="1075" class="l">V2 tool call, not in V1</text>
</svg>
