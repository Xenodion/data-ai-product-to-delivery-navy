<circle cx="998" cy="535" r="4.5" fill="#fff" stroke="#e65100" stroke-width="2"/>
<circle cx="1324" cy="535" r="4.5" fill="#fff" stroke="#e65100" stroke-width="2"/>
<circle cx="1417" cy="350" r="4.5" fill="#fff" stroke="#e65100" stroke-width="2"/>
<circle cx="1167" cy="350" r="4.5" fill="#fff" stroke="#e65100" stroke-width="2"/>
<text x="767" y="285" class="lb" text-anchor="middle">Yes</text>
<text x="1041" y="285" class="lb" text-anchor="middle">Draft</text>
<text x="1291" y="285" class="lb" text-anchor="middle">Yes</text>
<text x="1541" y="285" class="lb" text-anchor="middle">Yes</text>
<text x="1530" y="525" class="lb" text-anchor="start">then approves</text>
<text x="653" y="388" class="lo" text-anchor="start">No</text>
<text x="655" y="406" class="lo" text-anchor="start">a draft is still written</text>
<text x="915" y="415" class="lo" text-anchor="start">Yes: one new draft</text>
<text x="1010" y="525" class="lo" text-anchor="start">No: agent takes over</text>
<text x="1427" y="415" class="lo" text-anchor="start">No</text>
<text x="1177" y="415" class="lo" text-anchor="start">No: wrong desk</text>
<text x="915" y="222" class="lt" text-anchor="start">V2: asks for facts</text>
<path class="m" d="M40 684H76"/><text x="84" y="689" class="n">normal path</text>
<path class="f" d="M190 684H226"/><text x="234" y="689" class="n">correction</text>
<path class="t2" d="M326 684H362"/><text x="370" y="689" class="n">V2 only</text>
<rect x="450" y="675" width="18" height="18" rx="5" fill="#d19a00"/><text x="476" y="689" class="n">decision</text>
<rect x="560" y="675" width="18" height="18" rx="5" fill="#ef6c00"/><text x="586" y="689" class="n">human</text>
<text x="1754" y="689" class="n" text-anchor="end">Urgency never changes the path: it is shown to the agent. No model can send a reply or pick a queue.</text>
</svg>