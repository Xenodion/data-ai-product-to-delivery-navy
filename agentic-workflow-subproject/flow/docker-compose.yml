# D-q4 Qualifier on CPU. The model file stays outside Git, in agentic-workflow-subproject/models/.
services:
  qualifier:
    image: ghcr.io/ggml-org/llama.cpp:server-b5974
    command:
      - --model
      - /models/model-q4.gguf
      - --ctx-size
      - "2048"
      - --parallel
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ../models:/models:ro
