# Weights and values of the scenario-card sampler (dataset_build/cards.py). Weights need not sum to 1.
# Profiles: trap_boost multiplies the weight of every trap case; quota forces at least N cards carrying a tag.
# train = natural distribution (the pool is drawn with it); seeds = the hand-validated seed set.
# [splits] sizes the pool and its split; sizes are provisional until the price calculation.

problem_sub_intents = ["delayed_credit", "missing_payment", "unauthorised_fee", "chargeback", "duplicate_charge", "amount_mismatch", "webhook_down", "api_error", "auth_failure", "account_hold"]
always_high_sub_intents = ["account_hold"]  # a restricted or frozen account is high by definition
amount_min = 8.0  # EUR-scale bounds of the drawn amounts, log-uniform
amount_max = 250000.0

[splits]
pool = 9000
train = 2000
val = 300
test_natural = 500
min_per_trap = 20

[profiles.train]
trap_boost = 1.0

[profiles.seeds]
trap_boost = 1.5

[profiles.seeds.quota]
"trap:id_spaced" = 1
"trap:id_nohyphen" = 1
"trap:id_lowercase" = 1
"trap:id_split_lines" = 1
"trap:id_subject_only" = 1
"trap:id_quoted_only" = 1
"trap:id_bare_with_intro" = 1
"trap:id_two_main" = 1
"trap:id_two_equal" = 1
"trap:id_lookalike" = 2
"trap:id_bare_no_intro" = 1
"trap:id_malformed" = 1
"trap:amount_k_suffix" = 1
"trap:amount_approx" = 1
"trap:amount_two_main" = 1
"trap:amount_two_equal" = 1
"trap:currency_lone_dollar" = 1
"trap:currency_missing" = 1
"trap:thanks_hiding_problem" = 1
"trap:furious_not_urgent" = 1
"trap:polite_but_urgent" = 1
"trap:prompt_injection" = 1
"trap:other_language" = 1
"sentinel:two_equal_requests" = 1
"sentinel:too_vague" = 1
"sentinel:truncated" = 1
"sentinel:unintelligible" = 1
"sentinel:pricing" = 1
"sentinel:thanks_only" = 1
"intent:payment_status" = 2
"intent:dispute" = 2
"intent:technical_api" = 2
"intent:compliance" = 2
"lang:en" = 10

# --- label-determining variables ---------------------------------------------------------------------------
[intent]
payment_status = 0.20
dispute = 0.20
technical_api = 0.20
compliance = 0.20
OTHER = 0.08
UNDEFINED = 0.12

[sub_case]  # for the four real intents: the intent is clear but the sub-intent is not listed / not decidable
normal = 0.92
sub_other = 0.04
sub_undefined = 0.04

[other_kind]
pricing = 3
feature_request = 3
thanks_only = 2
off_topic = 2
spam = 1

[undefined_kind]
two_equal_requests = 4
too_vague = 3
truncated = 2
unintelligible = 1

# A real problem for the merchant is at least medium; low is reserved for informational requests.
[urgency_problem]
high = 0.35
medium = 0.65
low = 0.0
UNDEFINED = 0.0  # only the too_vague / unintelligible kinds are unreadable

[urgency_info]
high = 0.10
medium = 0.25
low = 0.65
UNDEFINED = 0.0

[urgency_other]
high = 0.03
medium = 0.20
low = 0.72
UNDEFINED = 0.0  # only the too_vague / unintelligible kinds are unreadable

[sentiment]
negative = 0.40
neutral = 0.40
positive = 0.15
UNDEFINED = 0.0  # only the too_vague / unintelligible kinds are unreadable

[cues.urgency]
high = ["states a deadline within 48 hours", "says their business activity is blocked", "says funds or the account are frozen", "mentions a regulatory deadline"]
medium = ["describes a real, ongoing problem but says operations continue (a workaround exists), with no deadline and nothing blocked"]
low = ["purely informational, no time pressure, no impact"]
UNDEFINED = ["gives too little information to judge how urgent it is"]

[cues.sentiment]
negative = ["openly frustrated or angry", "complains firmly", "threatens to leave or escalate"]
neutral = ["factual and polite, with no emotion and none of these words: frustrated, unacceptable, disappointed, again"]
positive = ["gives a clear compliment about the service or the team, not just a routine thank-you"]
UNDEFINED = ["unintelligible text from which no tone can be read"]

