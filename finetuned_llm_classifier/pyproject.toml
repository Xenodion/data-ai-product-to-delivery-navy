[project]
name = "finetuned-llm-classifier"
version = "0.1.0"
description = "Fine-tuned LLM that turns raw merchant tickets into a strict JSON (LLMOps course sub-project of NAVY)"
readme = "README.md"
requires-python = ">=3.11.6,<3.12"
dependencies = [
    "bitsandbytes>=0.50.2",
    "datasets<4",
    "gcsfs>=2024.1",
    "google-cloud-aiplatform>=2.4.0",
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-storage>=3.16.0",
    "kfp>=2.17.0",
    "langchain-community<0.4",
    "pandas>=3.0.6",
    "peft==0.13.2",
    "pydantic>=2.0",
    "python-dotenv>=1.2.4",
    "ragas>=0.3.2",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.6.0",
    "tensorboard>=2.21.0",
    "transformers==4.46.*",
    "trl==0.12.*",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
]
